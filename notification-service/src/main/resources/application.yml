server:
  port: 8080

spring:
  application:
    name: notification-service
  rabbitmq:
    host: ecommerce-rabbitmq
    port: 5672
    username: rabbitmq
    password: rabbitmq

eureka:
  client:
    serviceUrl:
      defaultZone: http://ecommerce-eureka-server:8761/eureka/
  instance:
    preferIpAddress: true