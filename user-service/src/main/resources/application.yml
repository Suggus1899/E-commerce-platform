server:
  port: 8080

spring:
  application:
    name: user-service
  datasource:
    # Use Docker compose service name for host
    url: jdbc:postgresql://ecommerce-postgres:5432/ecommerce_db
    username: ecommerce_user
    password: ecommerce_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    serviceUrl:
      defaultZone: http://ecommerce-eureka-server:8761/eureka/
  instance:
    preferIpAddress: true

jwt:
  # Using a placeholder secret for the scaffold
  secret: REDACTED
  expirationMs: 86400000